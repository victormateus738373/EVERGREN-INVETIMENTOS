name: Deploy Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_EVERGREN_INVETIMENTOS }}'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Firebase CLI
        run: npm install --global firebase-tools
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install
      - name: Configure private admin environment
        env:
          ADMIN_UID: ${{ secrets.ADMIN_UID }}
        run: |
          test -n "$ADMIN_UID" || (echo 'Missing ADMIN_UID GitHub secret' && exit 1)
          printf 'ADMIN_UID=%s\n' "$ADMIN_UID" > functions/.env
      - name: Deploy Hosting, Functions and Database Rules
        run: firebase deploy --project evergren-invetimentos --only hosting,functions,database
